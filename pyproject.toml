[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "serato-usb-export"
version = "1.2.2"
description = "Better Serato USB export that beats Serato's sync by putting all files in 1 folder (without duplicates) and only copying changed files, unlike Serato's sync which takes forever and creates many duplicate file locations"
keywords = [
    "serato",
    "serato usb",
    "serato usb sync",   
    "serato usb export",
]
requires-python = ">= 3.12"
readme = "README.md"
authors = [
    { name = "bvandrc", email = "bvandercar@outlook.com" },
]
license = "MIT"
dependencies = ["serato_tools>=6.0.0"]

[project.optional-dependencies]
# Ruff up to its next minor version, since a minor release can add stable rules and change its formatting
dev = ["ruff>=0.17,<0.18", "pyright"]

[project.urls]
Homepage = "https://github.com/bvandrc/serato-usb-export"
Repository = "https://github.com/bvandrc/serato-tools"
Issues = "https://github.com/bvandrc/serato-tools/issues"
Changelog = "https://github.com/bvandrc/serato-usb-export/blob/main/CHANGELOG.md"

[project.scripts]
serato_usb_export = "serato_usb_export.usb_export:main"

[tool.setuptools.packages.find]
where = ["src"] 
include = ["serato_usb_export*"]  

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Every stable rule, less those below. A Ruff minor release can add stable rules, which only reach CI through a PR
# that bumps the pinned Ruff, so each one gets a decision there.
select = ["ALL"]
ignore = [
    "D",  # docstring style: the wrapper's modules only re-export serato-tools' main
    "CPY",  # copyright notices
    "COM",  # trailing commas: the formatter adds them, and COM812 conflicts with it
    "ISC001",  # implicitly concatenated strings on one line: conflicts with the formatter
]

# Groups the imports into the standard library, third-party packages, and this repo's modules, each sorted.
[tool.ruff.lint.isort]
known-first-party = ["serato_usb_export"]
combine-as-imports = true
